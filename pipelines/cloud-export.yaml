# Ships production host metrics to Grafana Cloud via the OTLP gateway.
# Requires GCLOUD_OTLP_ENDPOINT and GCLOUD_OTLP_INSTANCE_ID in .env — the
# ${env:...} references resolve inside each collector container at runtime,
# so no secrets ever land in this repo or in Fleet Management.
name: cloud_export
config_type: otel
enabled: true
matchers:
  - environment="production"
contents: |
  extensions:
    basicauth/grafana-cloud:
      client_auth:
        username: "${env:GCLOUD_OTLP_INSTANCE_ID}"
        password: "${env:GCLOUD_RW_API_KEY}"
  receivers:
    hostmetrics/cloud:
      collection_interval: 60s
      scrapers:
        cpu: {}
        memory: {}
  processors:
    batch/cloud: {}
    # hostmetrics data has an empty resource — without service.name the OTLP
    # gateway can't set a job label and all collectors collide into the same
    # series. Stamp identity from each container's env.
    resource/cloud:
      attributes:
        - key: service.name
          value: "${env:FLEET_COLLECTOR_NAME}"
          action: upsert
        - key: environment
          value: "${env:FLEET_ENVIRONMENT}"
          action: upsert
        - key: team
          value: "${env:FLEET_TEAM}"
          action: upsert
        - key: fleet
          value: otelcol-fleet-demo
          action: upsert
  exporters:
    otlphttp/grafana-cloud:
      endpoint: "${env:GCLOUD_OTLP_ENDPOINT}"
      auth:
        authenticator: basicauth/grafana-cloud
  service:
    extensions: [basicauth/grafana-cloud]
    pipelines:
      metrics/cloud:
        receivers: [hostmetrics/cloud]
        processors: [resource/cloud, batch/cloud]
        exporters: [otlphttp/grafana-cloud]
