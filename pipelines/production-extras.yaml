# Only production collectors get the heavier scrape set. Component names are
# suffixed (/prod) so this config merges cleanly with baseline-hostmetrics
# when Fleet Management combines all matching pipelines into one config.
name: production-extras
config_type: otel
enabled: true
matchers:
  - environment="production"
contents: |
  receivers:
    hostmetrics/prod:
      collection_interval: 15s
      scrapers:
        load: {}
        filesystem: {}
        network: {}
  processors:
    batch/prod: {}
  exporters:
    debug/prod:
      verbosity: normal
  service:
    pipelines:
      metrics/prod:
        receivers: [hostmetrics/prod]
        processors: [batch/prod]
        exporters: [debug/prod]
