# Ad-hoc OTel canary pipeline for break-glass workflows — see docs/gcx-workflow.md.
# Lives in examples/ (NOT pipelines/) on purpose: the GitOps sync only scans
# pipelines/, so this is only ever deployed explicitly via:
#
#   FM_API_TOKEN=<write-token> ./scripts/upsert-pipeline.py examples/canary-checkout-debug.yaml
#   FM_API_TOKEN=<write-token> ./scripts/upsert-pipeline.py --delete canary_checkout_debug
#
# (Deployed via the Pipeline API, not gcx: `gcx fleet pipelines create`
# currently only accepts Alloy-type pipelines.)
#
name: canary_checkout_debug
config_type: otel
enabled: true
matchers:
  - team="checkout"
contents: |
  receivers:
    hostmetrics/canary:
      collection_interval: 5s
      scrapers:
        cpu: {}
        memory: {}
        processes: {}
  exporters:
    debug/canary:
      verbosity: detailed
  service:
    pipelines:
      metrics/canary:
        receivers: [hostmetrics/canary]
        exporters: [debug/canary]
